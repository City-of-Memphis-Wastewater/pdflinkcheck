[project]
name = "pdflinkcheck"
dynamic = ["version"] # look in src/pdflinkcheck/VERSION
description = "A purpose-built PDF link analysis and reporting tool with GUI and CLI."
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "openpyxl>=3.1.5",
    "pyhabitat>=1.2.6",
    "pypdf>=6.4.2",
    "rich>=14.2.0",
    "typer>=0.20.0",
    "typer-helptree>=0.2.10.5",
    "click>=8.1.8",
]

license = "MIT"
license-files = ["LICENSE", "NOTICE"]

classifiers=[
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers", # library and documentation
    "Intended Audience :: Science/Research", # Technical manuals, engineering
    "Intended Audience :: Other Audience", # Government/engineering docs
    "Topic :: File Formats",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: General",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Typing :: Typed",
    "Development Status :: 4 - Beta",
    #"Development Status :: 5 - Production/Stable",
]

authors = [
    { name = "George Clayton Bennett", email = "george.bennett@memphistn.gov" },
]
maintainers = [
    { name = "George Clayton Bennett", email = "george.bennett@memphistn.gov" },
]

keywords = [
    "pdf",
    "links",
    "analysis",
    "validation",
    "audit",
    "cli",
    "gui",
    "pymupdf",
    "pypdf",
    "pdfium",
    "document-processing",
]

[project.urls]
Homepage = "https://github.com/city-of-memphis-wastewater/pdflinkcheck"
Repository = "https://github.com/city-of-memphis-wastewater/pdflinkcheck"
Issues = "https://github.com/city-of-memphis-wastewater/pdflinkcheck/issues"
Changelog = "https://raw.githubusercontent.com/city-of-memphis-wastewater/pdflinkcheck/main/docs/CHANGELOG.md"

[project.scripts]
pdflinkcheck = "pdflinkcheck.cli:app"


[project.optional-dependencies]
pymupdf = ["pymupdf>=1.24.0,<2.0.0"] # fails on termux # If you choose to include PyMuPDF, you must comply with the AGPL3
pdfium = ["pypdfium2>=5.2.0,<6.0.0"]
#full = ["pdlinkcheck[pymupdf,pdfium]"]

# add with `uv sync --group dev`, plus other extras, like `--extra pdfium`
[dependency-groups]
dev = [
    "build>=1.3.0",
    "pyinstaller>=6.17.0 ; platform_system == 'Linux' and platform_machine != 'aarch64'", # to avoid on termux
    "shiv>=1.0.8",
    "ruff>=0.7.0 ; platform_system == 'Linux' and platform_machine != 'aarch64'", # to avoid on termux
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]


[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
pdflinkcheck = { path = "src/pdflinkcheck" }
#pyhabitat = { path = "../pyhabitat/dist/pyhabitat-1.2.3-py3-none-any.whl" }

[tool.setuptools.dynamic]
version = {file = "src/pdflinkcheck/VERSION"}

