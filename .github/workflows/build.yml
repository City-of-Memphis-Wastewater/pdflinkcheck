# .github/workflows/build.yml

name: Build pdflinkcheck artifacts

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Clean Build Directories (Unix/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "Cleaning build directories..."
          rm -rf dist/ build/ *.egg-info
          echo "Clean complete."
          
      - name: Clean Build Directories (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          echo "Cleaning build directories..."
          # Use Remove-Item with -Recurse and -Force (PowerShell native)
          Remove-Item -Path dist/, build/, *.egg-info -Recurse -Force -ErrorAction SilentlyContinue
          echo "Clean complete."
          
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # This ensures the created venv is activated implicitly
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install shiv  pyinstaller build uv
          pip install -e ".[pdfium,pymupdf]"  # Ensure PyMuPDF and/or PDFium precense for the compiler to find 
         # pip install -e .

      #- name: Build sdist
      #  run: hatch build --target sdist
  
      - name: Build wheel & sdist
        if: matrix.os == 'ubuntu-latest' # ONLY build this once
        run: python -m build --sdist

      - name: Build PYZ (shiv)
        if: runner.os != 'Windows'
        run: |
          python build_pyz.py

      - name: Build executable (PyInstaller)
        run: |
          python build_executable.py --mode onedir

      - name: Build onefile executable for Windows (PyInstaller)
        if: runner.os == 'Windows'
        run: |
          python build_executable.py --mode onefile
      
      - name: Post-Build Cleanup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Removing redundant generic artifacts from both Windows builds..."
          # Remove sdist and wheel to prevent Release upload collisions with the Ubuntu runner's versions
          Remove-Item "dist/*.tar.gz" -ErrorAction SilentlyContinue
          Remove-Item "dist/*.whl" -ErrorAction SilentlyContinue
          Write-Host "Cleanup complete."

      - name: Post-Build Cleanup (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "Removing redundant generic artifacts from macOS build..."
          # Delete sdist and wheel to prevent collisions with the Ubuntu runner
          rm -f dist/*.tar.gz dist/*.whl
          echo "Cleanup complete."

      - name: Diagnostic, List PyInstaller Output
        shell: pwsh
        run: |
          Write-Host "--- DIST FOLDER OVERVIEW ---"
          Get-ChildItem dist -Depth 1 | Select-Object Name, PSIsContainer, Length | Format-Table -AutoSize
          
          Write-Host "--- SEARCHING FOR ARTIFACT ---"
          $item = Get-ChildItem "dist/pdflinkcheck-*" | Select-Object -First 1
          if ($item) {
              Write-Host "Found target: $($item.FullName) (Type: $(if($item.PSIsContainer){"Folder"}else{"File"}))"
              
              if ($item.PSIsContainer) {
                  Write-Host "--- DETAILED ONEDIR CONTENTS ---"
                  Get-ChildItem $item.FullName -Recurse | Select-Object Name, Length | Format-Table -AutoSize
              }
          } else {
              Write-Error "No pdflinkcheck-* artifacts found in dist/"
          }
      
      - name: Collect Windows artifacts
        if: runner.os == 'Windows'
        run: |
          New-Item -Path dist/upload -ItemType Directory -Force
    
          # Find all PyInstaller outputs (both the folder and the --onefile exe)
          $items = Get-ChildItem "dist/onedir/pdflinkcheck-*", "dist/onefile/pdflinkcheck-*"

          foreach ($item in $items) {
              $destination = "dist/upload/$($item.Name).zip"
              Write-Host "Archiving $($item.Name) to $destination"
              
              if ($item.PSIsContainer) {
                  # It's the onedir folder - zip the contents
                  Compress-Archive -Path "$($item.FullName)\*" -DestinationPath $destination -Force
              } else {
                  # It's the onefile executable - zip the file itself
                  Compress-Archive -Path $item.FullName -DestinationPath $destination -Force
              }
          }


      - name: Collect Unix artifacts
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/upload

          # Only copy generic artifacts on Ubuntu
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cp dist/*.tar.gz dist/upload/ 2>/dev/null || true
            cp dist/*.whl dist/upload/ 2>/dev/null || true
          fi

          echo "Zipping platform-specific outputs..."
          for item in dist/onedir/pdflinkcheck-* dist/onefile/pdflinkcheck-*; do
            # Skip the generic sdist and wheel files we just handled
            case "$item" in
              *.tar.gz|*.whl) continue ;;
            esac

            if [ -d "$item" ]; then
              base=$(basename "$item")
              tar -czf "dist/upload/${base}.tar.gz" -C dist/onedir "$base"
            elif [ -f "$item" ]; then
              cp "$item" dist/upload/
            fi
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdflinkcheck-${{ matrix.os }}
          path: dist/upload/

  attach-to-release:
    name: Attach artifacts to GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write
    
    steps:
      - name: Download all artifacts (from all three OS runners)
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Diagnostic - List Downloaded Artifacts
        shell: bash
        run: |
          echo "=== Global Artifacts Directory Structure ==="
          # This shows exactly which files were pulled from which runner
          find artifacts -maxdepth 3 -not -path '*/.*'
          
          echo "=== Checking for Filename Collisions ==="
          # This counts how many times each filename appears across all runner folders
          find artifacts -type f -not -path '*/.*' -printf "%f\n" | sort | uniq -c | sort -nr

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          #overwrite: true
          overwrite_files: true # depends on version
          fail_on_unmatched_files: true # fails if empty
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
